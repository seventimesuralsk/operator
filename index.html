<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f5f5f7">
<title>SEVEN · Оператор</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--side:#f5f5f7;--card:#fff;--txt:#1d1d1f;--sub:#86868b;--sep:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --acc:#0071e3;--accs:rgba(0,113,227,.1);--out:#0a84ff;--in:#e9e9eb;--green:#34c759;--red:#ff3b30;--orange:#ff9500;
  --sh1:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);--sh2:0 10px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --r:14px;--ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--side);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;letter-spacing:inherit}
svg{flex-shrink:0}
.hidden{display:none!important}
.ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;color:var(--sub);flex-shrink:0;transition:background .15s,color .15s}
.ic:hover{background:var(--fill2);color:var(--txt)}
.ic.on{color:var(--acc)}
kbd{font:500 11px/1 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;color:var(--sub);background:#fff;border-radius:5px;padding:3px 5px;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.08);white-space:nowrap}

/* ── вход (как Apple ID) */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#fff 0%,var(--side) 60%);z-index:50;padding:24px}
#login form{width:100%;max-width:380px;background:#fff;border-radius:22px;box-shadow:var(--sh2);padding:40px 32px 32px;text-align:center}
#login .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 22px;background:linear-gradient(145deg,#a3193b,#5c0d1f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.8px;box-shadow:0 8px 24px rgba(122,17,40,.35)}
#login h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
#login p{color:var(--sub);margin:0 0 26px;font-size:14px}
.igroup{border:1px solid rgba(0,0,0,.14);border-radius:12px;overflow:hidden;text-align:left}
.igroup input{display:block;width:100%;height:50px;border:none;border-top:1px solid var(--sep);background:#fff;color:var(--txt);padding:0 16px;font-size:16px;outline:none}
.igroup input:first-child{border-top:none}
.igroup input:focus{background:#fafafa}
#login .go{width:100%;height:48px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;margin-top:18px;transition:filter .15s,transform .1s}
#login .go:hover{filter:brightness(1.08)}#login .go:active{transform:scale(.99)}
#login .err{color:var(--red);min-height:20px;margin-top:12px;font-size:13px}
#login .foot{color:var(--sub);font-size:12px;margin-top:6px}

/* ── раскладка */
.app{display:grid;grid-template-columns:330px minmax(0,1fr) auto auto;grid-template-rows:minmax(0,1fr);height:100%;height:100dvh;overflow:hidden}
.app>*{min-height:0}
html,body{overflow:hidden}
.side{display:flex;flex-direction:column;border-right:1px solid var(--sep);min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--side)}
.side-top{padding:16px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand .appic{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#a3193b,#5c0d1f);color:#fff;font-size:16px;font-weight:700;box-shadow:0 2px 6px rgba(122,17,40,.3);display:flex;align-items:center;justify-content:center}
.brand h2{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em}
.search{height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--sub)}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--txt);font-size:15px}
.search kbd{background:rgba(255,255,255,.7)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;color:var(--txt);transition:background .2s,box-shadow .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button i{font-style:normal;color:var(--sub);font-weight:500;margin-left:3px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:10px 4px 4px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.15)}
.conn{cursor:pointer}.r-sub .typ{color:var(--green,#34c759);font-style:normal;font-weight:500}.fbin{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:12px 14px;border:1px solid var(--line,#e5e5ea);border-radius:12px;font:inherit;font-size:15px;background:var(--card,#fff);color:inherit;outline:none}.fbin:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.15)}.conn.fast::after{content:"⚡ мгновенно";margin-left:4px;color:var(--green);font-weight:600}
.conn.bad{color:var(--red)}.conn.bad::before{background:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.15)}
.list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;position:relative;transition:background .15s}
.row:hover{background:rgba(0,0,0,.035)}
.row.sel{background:#fff;box-shadow:var(--sh1)}
.ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;position:relative;letter-spacing:0}
.ava.sm{width:36px;height:36px;font-size:14px}
.ava.xl{width:76px;height:76px;font-size:28px;margin:0 auto}
.ava .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--side)}
.row.sel .ava .dot{border-color:#fff}
.r-main{flex:1;min-width:0}
.r-top,.r-bot{display:flex;align-items:center;gap:6px}
.r-name{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-time{font-size:12px;color:var(--sub);flex-shrink:0}
.r-sub{flex:1;min-width:0;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.un .r-sub{color:var(--txt)}
.lg{font-size:10px;font-weight:600;padding:2px 5px;border-radius:5px;background:var(--fill);color:var(--sub);flex-shrink:0;letter-spacing:.3px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.empty{color:var(--sub);text-align:center;padding:48px 24px;line-height:1.5;font-size:14px}
.empty svg{display:block;margin:0 auto 12px;color:#c7c7cc}

/* ── переписка */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--bg);position:relative}
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);text-align:center;padding:24px}
.main-empty svg{color:#d1d1d6}
.main-empty b{color:var(--txt);font-size:20px;font-weight:600;letter-spacing:-.02em}
.main-empty .keys{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:10px;font-size:13px}
.main-empty .keys span{display:inline-flex;align-items:center;gap:6px}
.head{display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;height:60px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep);position:relative;z-index:2}
.head .t{flex:1;min-width:0}
.head .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t small{color:var(--sub);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t small.on{color:var(--green)}
.back{display:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 0 14px;display:flex;flex-direction:column}
.wrap{width:100%;max-width:780px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;color:var(--sub);font-size:12px;font-weight:600;margin:16px 0 8px}
.m{display:flex;flex-direction:column;max-width:min(520px,78%);position:relative}
.m.in{align-self:flex-start}.m.out{align-self:flex-end}
.b{padding:8px 12px;border-radius:18px;position:relative;overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px;line-height:1.38}
.m.in .b{background:var(--in);color:var(--txt)}
.m.out .b{background:var(--out);color:#fff}
.m.flash .b{animation:fl 1.1s}
@keyframes fl{30%{filter:brightness(.85)}}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:7px 0 -3px 10px;font-size:11px;line-height:1;white-space:nowrap;user-select:none;font-variant-numeric:tabular-nums}
.m.in .meta{color:rgba(0,0,0,.4)}.m.out .meta{color:rgba(255,255,255,.75)}
.meta svg{width:15px;height:10px}
.m.out .meta .tk{color:#fff}
.q{border-left:3px solid var(--acc);background:rgba(0,0,0,.05);border-radius:8px;padding:4px 9px;margin:0 0 6px;font-size:13px;cursor:pointer;white-space:normal}
.m.out .q{border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.16)}
.q b{display:block;color:var(--acc);font-size:12px;font-weight:600}
.m.out .q b{color:#fff}
.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.rx{display:flex;gap:4px;margin-top:-6px;position:relative;z-index:1;padding:0 6px}
.m.out .rx{justify-content:flex-end}
.rx span{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);border-radius:12px;padding:2px 7px;font-size:14px;display:inline-flex;align-items:center;gap:3px}
.rx span i{font-style:normal;font-size:10px;color:var(--sub)}
.svc{display:flex;align-items:flex-start;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.28);font-size:12.5px;line-height:1.35;white-space:normal;opacity:.95}
.svc svg{width:14px;height:14px;margin-top:1px}
.m.in .svc{border-color:rgba(0,0,0,.08)}
.pend{opacity:.55}.fail .b{box-shadow:0 0 0 1.5px var(--red)}
.failtxt{font-size:12px;color:var(--red);text-align:right;cursor:pointer;margin-top:3px}
/* голосовое */
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.vplay{width:34px;height:34px;border-radius:50%;background:var(--out);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m.out .vplay{background:#fff;color:var(--out)}
.vbars{flex:1;display:flex;align-items:center;gap:2px;height:24px}
.vbars i{flex:1;background:currentColor;opacity:.3;border-radius:2px;min-height:3px}
.vbars i.on{opacity:1}
.vdur{font-size:11px;opacity:.7;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.vtxt{font-size:13px;opacity:.75;margin-top:4px;white-space:normal}
/* кружочек */
.m.vn .b{background:none!important;padding:0}
.vn-c{width:240px;height:240px;border-radius:50%;overflow:hidden;position:relative;background:#1c1c1e;cursor:pointer;-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%);-webkit-mask-image:-webkit-radial-gradient(white,black);isolation:isolate;transform:translateZ(0)}
.vn-c video{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.vn-c .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vn-c .pl span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center}
.vn-c.playing .pl{display:none}
.m.vn .meta{float:none;align-self:flex-end;background:rgba(0,0,0,.35);color:#fff!important;padding:3px 7px;border-radius:10px;margin:4px 0 0}
.m.vn .meta .tk{color:#fff!important}
.pimg{width:260px;max-width:100%;min-height:140px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;cursor:zoom-in;margin:-4px -8px 4px}
.pimg img{display:block;width:100%;height:auto}.pimg.st{width:150px;min-height:150px;background:transparent}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.down{position:absolute;right:20px;bottom:150px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--sub);box-shadow:var(--sh2);display:flex;align-items:center;justify-content:center;z-index:3}

/* ── ввод + быстрые кнопки */
.comp{border-top:1px solid var(--sep);background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:8px 16px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.qwrap{position:relative;max-width:780px;margin:0 auto}
.qbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;scroll-behavior:smooth}
.qarr{position:absolute;top:1px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.06);color:var(--txt);display:none;align-items:center;justify-content:center;z-index:2}
.qarr:hover{background:#fff;color:var(--acc)}
.qarr.l{left:-4px}.qarr.r{right:-4px}
.qwrap.cl .qarr.l,.qwrap.cr .qarr.r{display:flex}
.qwrap.cl::before,.qwrap.cr::after{content:"";position:absolute;top:0;bottom:10px;width:44px;pointer-events:none;z-index:1}
.qwrap.cl::before{left:0;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.qwrap.cr::after{right:0;background:linear-gradient(270deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.qbar::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:16px;background:var(--fill2);font-size:13px;font-weight:500;white-space:nowrap;color:var(--txt);transition:background .15s,transform .1s;flex-shrink:0}
.chip:hover{background:var(--fill)}
.chip:active{transform:scale(.97)}
.chip svg{width:16px;height:16px;color:var(--acc)}
.chip kbd{display:none;margin-left:2px;padding:2px 4px;font-size:10px}
body.alt .chip kbd{display:inline-block}
#menu .it kbd{background:rgba(255,255,255,.7)}
.chip.pri{background:var(--accs);color:var(--acc)}
.chip.pri:hover{background:rgba(0,113,227,.16)}
.qsep{width:1px;background:var(--sep);margin:6px 4px;flex-shrink:0}
.comp-in{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:10px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--fill2);color:var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:3px;transition:background .15s,color .15s}
.plus:hover{background:var(--fill);color:var(--txt)}
.field{flex:1;min-width:0;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:20px;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:rgba(0,113,227,.5);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.reply{display:flex;align-items:center;gap:8px;padding:8px 6px 0 12px}
.reply .q{flex:1;min-width:0;margin:0}
textarea{border:none;outline:none;background:none;resize:none;color:var(--txt);font-size:15px;padding:9px 14px;max-height:180px;min-height:38px;line-height:1.35}
textarea::placeholder{color:#a1a1a6}
.send{width:34px;height:34px;border-radius:50%;background:#d1d1d6;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:3px;transition:background .15s,transform .1s}
.send.on{background:var(--acc)}
.send:active{transform:scale(.9)}

/* ── инспектор гостя */
.insp{width:320px;height:100%;min-height:0;border-left:1px solid var(--sep);background:var(--side);overflow-y:auto;padding:22px 16px 28px}
.insp .who{text-align:center;padding:4px 0 2px}
.insp .who b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.insp .who small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.insp .who small.on{color:var(--green)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--acc);padding:10px 2px 8px;background:#fff;border-radius:12px;box-shadow:var(--sh1);transition:transform .1s,box-shadow .15s;text-decoration:none}
.act:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.act:active{transform:scale(.96)}
.act svg{width:22px;height:22px}
.act.off{color:#c7c7cc;pointer-events:none;box-shadow:none;background:rgba(255,255,255,.6)}
.gh{font-size:12px;color:var(--sub);font-weight:500;margin:20px 4px 7px;text-transform:uppercase;letter-spacing:.04em}
.ghx{display:flex;align-items:center;justify-content:space-between}.ghx span{display:flex;gap:12px}
.lnk{border:none;background:none;padding:0;font:inherit;font-size:13px;text-transform:none;letter-spacing:0;color:var(--acc);cursor:pointer}.lnk.b{font-weight:600}
.li .v.wrap{white-space:normal;text-align:right;max-width:70%;line-height:1.3}
.f.two label.s{width:auto;margin-left:6px}.f.two input{width:40px}
.pedit .f label{width:84px}
.sugg{background:#fff}.sugg:empty{display:none}
.sg{padding:9px 14px;border-top:1px solid var(--sep);cursor:pointer;font-size:14px}.sg:hover{background:var(--fill)}
.sg b{font-weight:500;display:block}.sg small{color:var(--sub);font-size:12px}
.near{font-size:12px;color:var(--green,#34c759);padding:0 14px 10px;background:#fff}
.near.far{color:var(--sub)}
.grp{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--sh1)}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;border-top:1px solid var(--sep)}
.li:first-child{border-top:none}
.li svg{width:18px;height:18px;color:var(--sub)}
.li .k{color:var(--sub);flex:1}
.li .v{text-align:right;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.li.cart{display:block}
.li.cart .ci{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.li.cart .ci span:last-child{color:var(--sub)}
.li.tot{font-weight:600}
.li.btn{color:var(--acc);cursor:pointer;justify-content:flex-start}
.li.btn svg{color:var(--acc)}
.li.btn:hover{background:rgba(0,0,0,.02)}
.li.danger,.li.danger svg{color:var(--red)}
.insp .none{color:var(--sub);font-size:13px;text-align:center;padding:14px}

/* ── окна (sheet), меню, подсказки */
.sov.docked{position:static;inset:auto;background:none;padding:0;display:flex;width:390px;height:100%;min-height:0;border-left:1px solid var(--sep);z-index:auto;animation:dockin .22s var(--ease)}
@keyframes dockin{from{opacity:0;transform:translateX(24px)}}

      if (!data) return;
      var f = q.toLowerCase(), html = "", chips = "";
      Object.keys(data.categories).forEach(function (cat, ci) {
        var items = data.categories[cat].filter(function (it) { return !f || String(it.name).toLowerCase().indexOf(f) >= 0; });
        if (!items.length) return;
        chips += '<button type="button" data-cat="' + ci + '">' + esc(cat) + "</button>";
        html += '<div class="mp-cat" id="mpc' + ci + '">' + esc(cat) + '</div><div class="mp-grid">' + items.map(function (it) {
          var on = sel[it.id], ph = photoUrl(it.photo, 300);
          return '<div class="mp-it' + (on ? " on" : "") + (it.stopped ? " off" : "") + '" data-id="' + esc(it.id) + '">' + (ph ? '<img loading="lazy" alt="" src="' + esc(ph) + '">' : '<div class="ph"></div>') +
            '<span class="ck">' + ICO.check + "</span>" + (o.mode === "order" ? '<span class="qty"><button type="button" data-d="-1">−</button><span>' + (on ? on.qty : 1) + '</span><button type="button" data-d="1">+</button></span>' : "") +
            '<div class="nm">' + esc(it.name) + '</div><div class="pr">' + (it.stopped ? "Нет в наличии" : Number(it.price || 0).toLocaleString("ru") + " ₸") + "</div></div>";
        }).join("") + "</div>";
      });
      box.innerHTML = html || '<div class="none">Ничего не найдено</div>';
      cats.innerHTML = f ? "" : chips;
    }
    function load() {
      data = null; ov.querySelector("#mpList").innerHTML = '<div class="none">Загружаем меню…</div>';
      loadMenu(br).then(function (d) { data = d; render(); }, function () { ov.querySelector("#mpList").innerHTML = '<div class="none">Не удалось загрузить меню — проверьте интернет</div>'; });
    }
    ov.addEventListener("click", function (e) {
      var sb = e.target.closest('.seg[data-n="mbr"] button');
      if (sb) { br = sb.getAttribute("data-v"); load(); return; }
      var cb = e.target.closest("[data-cat]");
      if (cb) { var t = ov.querySelector("#mpc" + cb.getAttribute("data-cat")); if (t) t.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
      var it = e.target.closest(".mp-it"); if (!it) return;
      var id = it.getAttribute("data-id"), qb = e.target.closest(".qty button");
      var item = null; Object.keys(data.categories).forEach(function (k) { data.categories[k].forEach(function (x) { if (String(x.id) === id) item = x; }); });
      if (!item) return;
      if (qb && sel[id]) { sel[id].qty = Math.max(1, Math.min(99, sel[id].qty + Number(qb.getAttribute("data-d")))); it.querySelector(".qty span").textContent = sel[id].qty; return; }
      if (item.stopped && !sel[id]) return toast("Этого блюда сейчас нет в наличии");
      if (sel[id]) delete sel[id]; else sel[id] = { id: String(item.id), name: item.name, qty: 1 };
      it.classList.toggle("on", !!sel[id]); count();
    });
    ov.querySelector("#mpQ").addEventListener("input", function () { q = this.value.trim(); render(); });
    setTimeout(function () { var i = ov.querySelector("#mpQ"); if (i && innerWidth > 760) i.focus(); }, 80);
    load();
  }
  function dishSheet() {
    menuPicker({ mode: "send", title: "Отправить блюда", ok: "Отправить", onPick: function (arr) { sendNow("/#" + arr.map(function (x) { return x.id; }).join(",")); } });
  }

  // ════ быстрые кнопки над полем ввода ════
  var BUILTIN = [["бронь", "Бронь", "cal"], ["меню", "Меню", "book"], ["заказ", "Заказ", "bag"], ["корзина", "Корзина", "cart"], ["акции", "Акции", "tag"], ["вакансии", "Вакансии", "brief"]];
  var qa = []; try { qa = JSON.parse(ls("op_qa") || "[]") || []; } catch (e) { qa = []; }
  function quickItems() { return BUILTIN.map(function (b) { return { k: b[0], l: b[1], i: ICO[b[2]] }; }).concat(qa.map(function (n) { return { k: n, l: "/" + n, i: ICO.bolt }; })); }
  function renderQuick() {
    var h = '<button class="chip pri" data-q="order" title="Собрать заказ за гостя (' + ALT + 'O)">' + ICO.bag + "Собрать заказ</button>" +
      '<button class="chip pri" data-q="book" title="Собрать бронь (' + ALT + 'B)">' + ICO.cal + "Собрать бронь</button>" +
      '<button class="chip pri" data-q="dish" title="Блюдо из меню карточкой">' + ICO.fork + 'Блюдо</button><span class="qsep"></span>';
    h += quickItems().map(function (q, i) { return '<button class="chip" data-k="' + esc(q.k) + '" title="Отправить гостю /' + esc(q.k) + (i < 9 ? " · " + ALT + (i + 1) : "") + '">' + q.i + esc(q.l) + (i < 9 ? "<kbd>" + ALT + (i + 1) + "</kbd>" : "") + "</button>"; }).join("");
    if ($("qbar")._html !== h) { $("qbar")._html = h; $("qbar").innerHTML = h; }
    setTimeout(qArrows, 0);
  }
  // колесико мыши листает кнопки вбок; стрелки ‹ › по краям
  function qArrows() { var b = $("qbar"), w = $("qwrap"); w.classList.toggle("cl", b.scrollLeft > 4); w.classList.toggle("cr", b.scrollLeft + b.clientWidth < b.scrollWidth - 4); }
  $("qbar").addEventListener("wheel", function (e) { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { this.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  $("qbar").addEventListener("scroll", qArrows, { passive: true });
  window.addEventListener("resize", qArrows);
  $("qL").onclick = function () { $("qbar").scrollBy({ left: -260, behavior: "smooth" }); };
  $("qR").onclick = function () { $("qbar").scrollBy({ left: 260, behavior: "smooth" }); };
  $("qbar").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var q = b.getAttribute("data-q");
    if (q === "order") return orderSheet();
    if (q === "book") return bookSheet();
    if (q === "dish") return dishSheet();
    var k = b.getAttribute("data-k"); if (k) quickSend(k);
  };
  // быстрая кнопка: сразу гостю (есть 2,5 сек, чтобы отменить); набранный текст уходит вместе с кнопкой
  function quickSend(k) {
    if (!cur) return;
    var extra = txt.value.trim();
    if (extra) { txt.value = ""; grow(); syncSend(); }
    sendNow("/" + k + (extra ? " " + plainText(extra) : ""), 2500);
  }
  // свой текст с кнопкой — это просто текст: «сегодня до 21:00» не должно стать анкетой брони.
  // Невидимый символ внутри времени/даты: гость видит «21:00», а сервер не считает это анкетой.
  function plainText(t) { return t.replace(/(\d)([:.])(\d{2})/g, "$1$2\u200b$3").replace(/(^|\s)(в|к)(\s+\d)/gi, "$1$2\u200b$3"); }
  // твои ответы из листа «Быстрые_ответы» (сервер отдаёт их списком в подсказке /komandy)
  function loadQA() {
    if (!code) return;
    api({ action: "opPanelSend", cid: "__help", text: "/komandy" }, 20000).then(function (r) {
      if (!r || !r.help) return;
      var m = String(r.help).match(/Твои быстрые ответы[^:]*:\s*([^\n]+)/);
      qa = m ? m[1].split(",").map(function (x) { return x.trim().replace(/^\//, ""); }).filter(Boolean).slice(0, 24) : [];
      ls("op_qa", JSON.stringify(qa)); renderQuick();
    }).catch(function () {});
  }
  $("plus").onclick = function (e) {
    closeMenu();
    var r = this.getBoundingClientRect(), ov = D.createElement("div"); ov.id = "menu";
    var card = D.createElement("div"); card.className = "card";
    card.innerHTML = '<button class="it" data-a="order">' + ICO.bag + "Собрать заказ<kbd style=\"margin-left:auto\">" + ALT + "O</kbd></button>" +
      '<button class="it" data-a="book">' + ICO.cal + "Собрать бронь<kbd style=\"margin-left:auto\">" + ALT + "B</kbd></button>" +
      '<button class="it" data-a="dish">' + ICO.fork + "Блюдо из меню</button>" +
      '<button class="it" data-a="keys">' + ICO.keys + "Горячие клавиши<kbd style=\"margin-left:auto\">?</kbd></button>";
    ov.appendChild(card); D.body.appendChild(ov);
    card.style.left = Math.max(8, r.left) + "px"; card.style.top = Math.max(8, r.top - card.offsetHeight - 8) + "px";
    ov.onclick = function (ev) { var a = ev.target.closest("[data-a]"); closeMenu(); if (!a) return; var x = a.getAttribute("data-a"); if (x === "order") orderSheet(); else if (x === "book") bookSheet(); else if (x === "dish") dishSheet(); else keysSheet(); };
  };

  // ════ горячие клавиши ════
  function keysSheet() {
    var rows = [["Поиск чатов", MOD + "K"], ["Предыдущий / следующий чат", ALT + "↑|" + ALT + "↓"], ["Следующий непрочитанный", ALT + "N"], ["Быстрые кнопки 1–9", ALT + "1|…|" + ALT + "9"],
      ["Собрать заказ", ALT + "O"], ["Собрать бронь", ALT + "B"], ["Ответить на последнее сообщение гостя", ALT + "R"], ["Карточка гостя", ALT + "I"],
      ["Начать команду", "/"], ["Отправить", "Enter"], ["Новая строка", "Shift+Enter"], ["Закрыть / отменить", "Esc"], ["Эта шпаргалка", "?"]];
    sheet({ title: "Горячие клавиши", body: '<div class="keys-l">' + rows.map(function (r) { return "<span>" + r[0] + "</span><span>" + r[1].split("|").map(function (k) { return k === "…" ? "…" : "<kbd>" + esc(k) + "</kbd>"; }).join("") + "</span>"; }).join("") + "</div>" +
      '<div class="hint">Зажмите ' + (MAC ? "⌥ Option" : "Alt") + " — на быстрых кнопках появятся их клавиши.</div>" });
  }
  $("keysBtn").onclick = keysSheet;
  function stepChat(d) {
    var ids = [].map.call($("list").querySelectorAll(".row"), function (r) { return r.getAttribute("data-cid"); });
    if (!ids.length) return;
    var i = ids.indexOf(cur), n = i < 0 ? (d > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, i + d));
    if (ids[n] && ids[n] !== cur) { open(ids[n]); var el = $("list").querySelector('.row[data-cid="' + cssEsc(ids[n]) + '"]'); if (el) el.scrollIntoView({ block: "nearest" }); }
  }
  function nextUnread() { var c = chats.filter(function (x) { return x.un && x.cid !== cur; })[0]; if (c) open(c.cid); else toast("Непрочитанных нет"); }
  function replyLast() { var g = thread.filter(function (x) { return x.f === "g"; }).pop(); if (g) startReply(g); }
  D.addEventListener("keydown", function (e) {
    if (e.key === "Alt") D.body.classList.add("alt");
    var tag = (e.target && e.target.tagName) || "", typing = /INPUT|TEXTAREA|SELECT/.test(tag), mod = e.metaKey || e.ctrlKey;
    if (e.key === "Escape") {
      if ($("sov")) { var oc = sheetCancel; sheetCancel = null; closeSheet(); if (oc) oc(); return; }
      if ($("menu")) return closeMenu();
      if (replyTo) return closeReply();
      if (innerWidth <= 1180 && inspOn) return toggleInsp();
      return;
    }
    if ($("sov") || $("app").classList.contains("hidden")) return;
    if (mod && !e.altKey && e.code === "KeyK") { e.preventDefault(); $("q").focus(); $("q").select(); return; }
    if (e.altKey && !mod) {
      var c = e.code;
      if (c === "ArrowUp" || c === "ArrowDown") { e.preventDefault(); return stepChat(c === "ArrowDown" ? 1 : -1); }
      if (c === "KeyN") { e.preventDefault(); return nextUnread(); }
      if (/^Digit[1-9]$/.test(c)) { e.preventDefault(); var it = quickItems()[Number(c.slice(5)) - 1]; if (it) quickSend(it.k); return; }
      if (c === "KeyO") { e.preventDefault(); return orderSheet(); }
      if (c === "KeyB") { e.preventDefault(); return bookSheet(); }
      if (c === "KeyR") { e.preventDefault(); return replyLast(); }
      if (c === "KeyI") { e.preventDefault(); return toggleInsp(); }
    }
    if ((mod && e.key === "/") || (!typing && e.key === "?")) { e.preventDefault(); return keysSheet(); }
    if (!typing && !mod && !e.altKey && cur && e.key === "/") { e.preventDefault(); txt.focus(); txt.value = "/"; syncSend(); return; }
  });
  D.addEventListener("keyup", function (e) { if (e.key === "Alt") D.body.classList.remove("alt"); });
  window.addEventListener("blur", function () { D.body.classList.remove("alt"); });
  $("kSearch").textContent = MOD + "K";
  $("emptyKeys").innerHTML = "<span><kbd>" + MOD + "K</kbd> поиск</span><span><kbd>" + ALT + "↓</kbd> следующий чат</span><span><kbd>" + ALT + "N</kbd> непрочитанный</span><span><kbd>?</kbd> все клавиши</span>";
  renderQuick();
  setInterval(loadQA, 10 * 60e3);

  D.addEventListener("visibilitychange", function () {
    if (D.visibilityState !== "visible") return;
    wakeUp();
    if (cur) { var c = chatBy(cur); if (c && c.un) markRead(cur); }
  });
  setInterval(function () { renderHead(); renderList(); }, 30000);

  if (code) {
    // сразу показываем то, что было при прошлом входе, — без ожидания Google
    var cached = loadCache();
    if (cached) {
      $("login").classList.add("hidden"); $("app").classList.remove("hidden");
      chats = visibleChats(cached.chats);
      if (cached.cur && cached.thread) { threads[cached.cur] = cached.thread; }
      renderList();
    }
    $("conn").textContent = "Обновляем…";
    api({ action: "opPanel" }, 25000).then(function (r) {
      if (r && r.auth === false) { logoutLocal(); return showLogin("Вход истёк — войдите снова"); }
      start(r && r.ok ? r : null);
    }).catch(function () { start(null); });
  } else showLogin();
})();
</script>
</body>
</html>

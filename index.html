<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>SEVEN · Оператор</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{
  --side:#fff;--line:#e7e7e7;--txt:#000;--sub:#707579;--acc:#3390ec;--hover:#f4f4f5;--sel:#3390ec;--seltxt:#fff;
  --chat:linear-gradient(160deg,#cfe0b4 0%,#a9c99a 45%,#8fbc8f 100%);
  --in:#fff;--out:#eeffde;--outtxt:#000;--outsub:#4fae4e;--tick:#4fae4e;--intxt:#000;--insub:#8a8a8a;
  --bar:#fff;--field:#fff;--shadow:0 1px 2px rgba(16,35,47,.15);--badge:#c4c9cc;--badgeon:#3390ec;--danger:#e53935;
  --menu:rgba(255,255,255,.96);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--side);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:var(--sub);flex-shrink:0}
.ic:hover{background:var(--hover)}
.hidden{display:none!important}

/* вход */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--side);z-index:50;padding:24px}
#login form{width:100%;max-width:340px;text-align:center}
#login .logo{width:120px;height:120px;border-radius:50%;margin:0 auto 24px;background:#7a1128;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;letter-spacing:.5px}
#login h1{font-size:1.6rem;margin:0 0 8px}
#login p{color:var(--sub);margin:0 0 28px}
#login input{width:100%;height:54px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--txt);padding:0 16px;font-size:16px;outline:none}
#login input:focus{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
#login .go{width:100%;height:54px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;margin-top:16px;text-transform:uppercase;letter-spacing:.3px}
#login .err{color:var(--danger);min-height:22px;margin-top:10px;font-size:.9rem}

/* раскладка */
.app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:100%;height:100dvh}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;background:var(--side)}
.side-h{display:flex;align-items:center;gap:8px;padding:8px 12px}
.search{flex:1;height:42px;border-radius:21px;background:var(--hover);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--sub)}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--txt);font-size:15px}
.list{flex:1;overflow-y:auto;padding:0 8px 8px}
.row{display:flex;gap:12px;align-items:center;padding:9px;border-radius:12px;cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);color:var(--seltxt)}
.row.sel .r-sub,.row.sel .r-time{color:rgba(255,255,255,.8)}
.ava{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:1.05rem;position:relative}
.ava.sm{width:42px;height:42px;font-size:.95rem}
.ava .dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:#0ac630;border:2.5px solid var(--side)}
.row.sel .ava .dot{border-color:var(--sel)}
.r-main{flex:1;min-width:0}
.r-top,.r-bot{display:flex;align-items:center;gap:6px}
.r-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-time{font-size:.78rem;color:var(--sub);flex-shrink:0}
.r-sub{flex:1;min-width:0;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lg{font-size:.68rem;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(51,144,236,.14);color:var(--acc);flex-shrink:0;letter-spacing:.3px}
.row.sel .lg{background:rgba(255,255,255,.25);color:#fff}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--badgeon);color:#fff;font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 7px;flex-shrink:0}
.row.sel .badge{background:#fff;color:var(--sel)}
.empty{color:var(--sub);text-align:center;padding:40px 20px;line-height:1.5}
.conn{font-size:.78rem;color:var(--sub);text-align:center;padding:4px 0 6px}
.conn.bad{color:var(--danger)}

/* чат */
.main{display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative}
.main-empty{flex:1;display:flex;align-items:center;justify-content:center}
.main-empty span{background:rgba(0,0,0,.22);color:#fff;padding:5px 14px;border-radius:16px;font-size:.9rem}
.head{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bar);min-height:56px;box-shadow:0 1px 0 var(--line)}
.head .t{flex:1;min-width:0}
.head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t small{color:var(--sub);font-size:.84rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t small.on{color:var(--acc)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 0 8px;display:flex;flex-direction:column}
.ctxbar{padding:8px 14px;background:#fffbea;border-bottom:1px solid #f1e3a6;font-size:13px;line-height:1.45;color:#3a3a3c}.ctxbar div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:rgba(0,0,0,.22);color:#fff;font-size:.8rem;font-weight:500;padding:3px 10px;border-radius:12px;margin:10px 0 6px}
.m{display:flex;flex-direction:column;max-width:min(480px,82%);position:relative}
.m.in{align-self:flex-start}.m.out{align-self:flex-end}
.b{padding:6px 8px 6px 10px;border-radius:14px;box-shadow:var(--shadow);position:relative;overflow-wrap:anywhere;white-space:pre-wrap}
.m.in .b{background:var(--in);color:var(--intxt);border-bottom-left-radius:4px}
.m.out .b{background:var(--out);color:var(--outtxt);border-bottom-right-radius:4px}
.m.flash .b{animation:fl 1.1s}
@keyframes fl{30%{filter:brightness(.8)}}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:6px 0 -4px 10px;font-size:.72rem;line-height:1;white-space:nowrap;user-select:none}
.m.in .meta{color:var(--insub)}.m.out .meta{color:var(--outsub)}
.meta svg{width:16px;height:11px}
.m.out .meta .tk{color:var(--tick)}
.q{border-left:3px solid var(--acc);background:rgba(51,144,236,.08);border-radius:4px;padding:3px 8px;margin:0 0 5px;font-size:.88rem;cursor:pointer;white-space:normal}
.m.out .q{border-color:var(--outsub);background:rgba(79,174,78,.12)}
.q b{display:block;color:var(--acc);font-size:.84rem}
.m.out .q b{color:var(--outsub)}
.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.rx{display:flex;gap:4px;margin-top:3px}
.m.out .rx{justify-content:flex-end}
.rx span{background:var(--in);box-shadow:var(--shadow);border-radius:12px;padding:1px 7px;font-size:.95rem;display:inline-flex;align-items:center;gap:3px}
.rx span i{font-style:normal;font-size:.7rem;color:var(--sub)}
.pend{opacity:.6}.fail .b{outline:1.5px solid var(--danger)}
.failtxt{font-size:.75rem;color:var(--danger);text-align:right;cursor:pointer;margin-top:2px}
/* голосовое */
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.vplay{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m.out .vplay{background:var(--outsub);color:var(--out)}
.vbars{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.vbars i{flex:1;background:currentColor;opacity:.35;border-radius:2px;min-height:3px}
.vbars i.on{opacity:1}
.vdur{font-size:.75rem;opacity:.75;display:block;margin-top:2px}
.vtxt{font-size:.85rem;opacity:.75;margin-top:4px;white-space:normal}
/* кружочек */
.m.vn .b{background:none!important;box-shadow:none;padding:0}
.vn-c{width:240px;height:240px;border-radius:50%;overflow:hidden;position:relative;background:#000;cursor:pointer;-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%);-webkit-mask-image:-webkit-radial-gradient(white,black);isolation:isolate;transform:translateZ(0)}
.pimg{width:260px;max-width:100%;min-height:140px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:13px;cursor:zoom-in;margin-bottom:4px}.pimg img{display:block;width:100%;height:auto}.pimg.st{width:150px;min-height:150px;background:transparent}
.vn-c video{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.vn-c .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vn-c .pl span{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.vn-c.playing .pl{display:none}
.m.vn .meta{float:none;align-self:flex-end;background:rgba(0,0,0,.35);color:#fff!important;padding:3px 7px;border-radius:10px;margin:4px 0 0}
.m.vn .meta .tk{color:#fff!important}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ввод */
.comp{padding:8px 12px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.comp-in{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.field{flex:1;min-width:0;background:var(--field);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.reply{display:flex;align-items:center;gap:8px;padding:8px 8px 0 12px}
.reply .q{flex:1;min-width:0;margin:0}
textarea{border:none;outline:none;background:none;resize:none;color:var(--txt);font:inherit;font-size:16px;padding:12px 14px;max-height:180px;min-height:48px;line-height:1.35}
.send{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow);transition:transform .1s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.5}
.down{position:absolute;right:18px;bottom:84px;width:46px;height:46px;border-radius:50%;background:var(--bar);color:var(--sub);box-shadow:0 1px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
/* меню по сообщению */
#menu{position:fixed;inset:0;z-index:40}
#menu .card{position:fixed;background:var(--menu);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.25);min-width:200px;overflow:hidden;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#menu .rbar{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
#menu .rbar button{font-size:1.45rem;width:38px;height:38px;border-radius:50%;transition:transform .1s}
#menu .rbar button:hover{transform:scale(1.2)}
#menu .rbar button.on{background:var(--hover)}
#menu .it{display:flex;align-items:center;gap:14px;width:100%;padding:11px 16px;text-align:left}
#menu .it:hover{background:var(--hover)}
#menu .it svg{color:var(--sub)}
#menu .it.danger,#menu .it.danger svg{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:60;pointer-events:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .main{position:fixed;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:10}
  .app.open .main{transform:none}
  .back{display:flex}
  .m{max-width:88%}
  .vn-c{width:210px;height:210px}
}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form autocomplete="off">
    <div class="logo">SEVEN</div>
    <h1>Оператор SEVEN AI</h1>
    <p>Войдите, чтобы отвечать гостям сайта.</p>
    <input id="user" type="text" placeholder="Логин" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <input id="secret" type="password" placeholder="Секретное слово" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <button class="go" type="submit">Войти</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="side-h">
      <button class="ic" id="menuBtn" title="Выйти" aria-label="Выйти"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Поиск: номер, имя, текст" autocomplete="off"></label>
      <button class="ic" id="bell" title="Уведомления" aria-label="Уведомления"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    </div>
    <div class="conn" id="conn">Подключение…</div>
    <div class="list" id="list"></div>
  </aside>
  <section class="main" id="main">
    <div class="main-empty" id="noChat"><span>Выберите чат с гостем</span></div>
    <div class="head hidden" id="head">
      <button class="ic back" id="back" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ava sm" id="hAva"></div>
      <div class="t"><b id="hName"></b><small id="hSub"></small></div>
      <button class="ic" id="delChat" title="Удалить чат" aria-label="Удалить чат"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg></button>
      <button class="ic" id="copyId" title="Скопировать ID гостя" aria-label="Скопировать ID"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
    </div>
    <div class="ctxbar hidden" id="ctxBar"></div>
    <div class="msgs hidden" id="msgs"><div class="wrap" id="wrap"></div></div>
    <button class="down hidden" id="down" aria-label="Вниз"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="comp hidden" id="comp">
      <div class="comp-in">
        <div class="field">
          <div class="reply hidden" id="replyBar"><div class="q" id="replyQ"></div><button class="ic" id="replyX" aria-label="Отменить ответ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
          <textarea id="txt" rows="1" placeholder="Сообщение" enterkeyhint="send"></textarea>
        </div>
        <button class="send" id="send" aria-label="Отправить"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.02 6.53L15 12 3.38 13.87z"/></svg></button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbzc9E5KPdwAGnEK87adnnlz0VcpmalwbR3fazfV15YZlFYxWMgYtT_aTxFR5_bO_WrDDQ/exec";
  var REACTS = ["👍", "❤️", "😂", "😮", "😢", "🙏", "👏"];
  var BR = { samal: "Самал 70/3", skoro: "Скоробогатова 65/1", abulhair: "Абулхаир Хана 177" };
  var LANG = { kz: "Қазақша", ru: "Русский" }, LANG_SHORT = { kz: "KZ", ru: "RU" };
  var COLORS = ["#e17076", "#faa774", "#a695e7", "#7bc862", "#6ec9cb", "#65aadd", "#ee7aae"];
  var TICK1 = '<svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6l3 3 6.5-7.5"/></svg>';
  var TICK2 = '<svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6.5-7.5"/><path d="M6.5 8.6l.9.9L14 2"/></svg>';
  var CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.3l2 1.2"/></svg>';
  var PLAY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

  var D = document, $ = function (id) { return D.getElementById(id); };
  ls("op_code", null); // старый формат (пароль в браузере) — удаляем
  var code = ls("op_token") || "", chats = [], cur = null, thread = [], ver = 0, replyTo = null, pending = [];
  var media = {}, player = null, lastUnread = -1, loopId = 0, readSent = {}, filter = "";
  var threads = {}, threadTs = {}; // чаты, которые уже открывали, — показываем мгновенно из памяти

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function hm(ts) { return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(ts) {
    var d = new Date(ts), t = new Date(), y = new Date(Date.now() - 864e5);
    if (d.toDateString() === t.toDateString()) return "Сегодня";
    if (d.toDateString() === y.toDateString()) return "Вчера";
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }
  function listTime(ts) { var d = new Date(ts); return d.toDateString() === new Date().toDateString() ? hm(ts) : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }); }
  function title(c) { return "Гость №" + (c.n || "?") + (c.name ? " · " + c.name : ""); }
  function color(n) { return COLORS[(Number(n) || 0) % COLORS.length]; }
  function online(c) { return c && c.on && Date.now() - c.on < 70e3; }
  function toast(t) { var e = D.createElement("div"); e.className = "toast"; e.textContent = t; D.body.appendChild(e); setTimeout(function () { e.remove(); }, 2200); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var pollCtl = null;
  function api(body, ms, isPoll) {
    var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    if (isPoll) pollCtl = ctl;
    var t = ctl ? setTimeout(function () { ctl.abort(); }, ms || 20000) : 0;
    body.code = code;
    return fetch(API, { method: "POST", body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined, cache: "no-store" })
      .then(function (r) { return r.json(); }) // страница ошибки Google (не JSON) → повтор, как при обрыве
      .finally(function () { clearTimeout(t); if (isPoll && pollCtl === ctl) pollCtl = null; });
  }

    var btn = vn ? box.querySelector(".pl span") : box.querySelector(".vplay");
    btn.innerHTML = '<div class="spin"></div>';
    loadMedia(fid).then(function (url) {
      var el;
      if (vn) {
        el = D.createElement("video"); el.playsInline = true; el.setAttribute("playsinline", ""); el.src = url;
        box.insertBefore(el, box.firstChild);
        el.onplay = function () { box.classList.add("playing"); };
        el.onpause = el.onended = function () { box.classList.remove("playing"); btn.innerHTML = PLAY; };
      } else {
        el = new Audio(url);
        var bars = box.querySelectorAll(".vbars i"), dEl = box.querySelector(".vdur");
        el.ontimeupdate = function () { var p = el.duration && isFinite(el.duration) ? el.currentTime / el.duration : 0; for (var i = 0; i < bars.length; i++) bars[i].classList.toggle("on", i / bars.length < p); dEl.textContent = dur(el.currentTime || 1); };
        el.onplay = function () { btn.innerHTML = PAUSE; };
        el.onpause = function () { btn.innerHTML = PLAY; };
        el.onended = function () { btn.innerHTML = PLAY; for (var i = 0; i < bars.length; i++) bars[i].classList.remove("on"); };
      }
      player = { id: id, el: el, node: box };
      el.play().catch(function () { btn.innerHTML = PLAY; });
    }, function () { btn.innerHTML = PLAY; toast("Не получилось загрузить — откройте в Telegram"); });
  });

  // ── меню сообщения: правый клик / долгое нажатие / двойной клик = ответить
  var pressT = 0;
  $("wrap").addEventListener("contextmenu", function (e) { var m = e.target.closest(".m"); if (!m) return; e.preventDefault(); menu(m, e.clientX, e.clientY); });
  $("wrap").addEventListener("touchstart", function (e) {
    var m = e.target.closest(".m"); if (!m) return;
    var t = e.touches[0]; clearTimeout(pressT);
    pressT = setTimeout(function () { if (navigator.vibrate) navigator.vibrate(10); menu(m, t.clientX, t.clientY); }, 450);
  }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(function (n) { $("wrap").addEventListener(n, function () { clearTimeout(pressT); }, { passive: true }); });
  $("wrap").addEventListener("dblclick", function (e) { var m = e.target.closest(".m"); if (m && !e.target.closest(".vn-c,.voice")) { var it = byId(m.getAttribute("data-id")); if (it) startReply(it); } });
  function byId(id) { return all().filter(function (x) { return x.id === id; })[0] || null; }
  function menu(node, x, y) {
    var it = byId(node.getAttribute("data-id"));
    if (!it || it.pending) return;
    closeMenu();
    var ov = D.createElement("div"); ov.id = "menu";
    var card = D.createElement("div"); card.className = "card";
    var html = "";
    if (it.f === "g") html += '<div class="rbar">' + REACTS.map(function (r) { return '<button data-r="' + r + '"' + (it.or === r ? ' class="on"' : "") + ">" + r + "</button>"; }).join("") + "</div>";
    html += '<button class="it" data-a="reply"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Ответить</button>';
    if (it.t && it.k !== "vn") html += '<button class="it" data-a="copy"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Копировать текст</button>';
    card.innerHTML = html; ov.appendChild(card); D.body.appendChild(ov);
    var w = card.offsetWidth, h = card.offsetHeight;
    card.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
    card.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px";
    ov.onclick = function (e) {
      var r = e.target.closest("[data-r]"), a = e.target.closest("[data-a]");
      if (r) react(it, it.or === r.getAttribute("data-r") ? "" : r.getAttribute("data-r"));
      else if (a && a.getAttribute("data-a") === "reply") startReply(it);
      else if (a && a.getAttribute("data-a") === "copy") { (navigator.clipboard ? navigator.clipboard.writeText(it.t) : Promise.reject()).then(function () { toast("Скопировано"); }, function () {}); }
      closeMenu();
    };
  }
  function closeMenu() { var m = $("menu"); if (m) m.remove(); }
  D.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeMenu(); closeReply(); } });
  function react(it, em) {
    it.or = em; renderThread();
    api({ action: "opPanelReact", cid: cur, id: it.id, emoji: em }).then(function (r) { if (!r || !r.ok) toast("Реакция не дошла"); }).catch(function () { toast("Нет связи"); });
  }

  // ── ответ на сообщение
  function startReply(it) {
    replyTo = it;
    $("replyQ").innerHTML = "<b>" + (it.f === "o" ? "Вы" : "Гость") + "</b><span>" + esc(it.k === "voice" ? "Голосовое сообщение" : it.k === "vn" ? "Кружочек" : it.t) + "</span>";
    $("replyBar").classList.remove("hidden"); $("txt").focus();
  }
  function closeReply() { replyTo = null; $("replyBar").classList.add("hidden"); }
  $("replyX").onclick = closeReply;

  // ── отправка
  var txt = $("txt");
  function grow() { txt.style.height = "auto"; txt.style.height = Math.min(180, txt.scrollHeight) + "px"; }
  txt.addEventListener("input", grow);
  txt.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendNow(); } });
  $("send").onclick = function () { sendNow(); txt.focus(); };
  function sendNow() {
    var t = txt.value.trim();
    if (!t || !cur) return;
    txt.value = ""; grow();
    var p = { id: "tmp" + Date.now() + Math.random().toString(36).slice(2, 6), cid: cur, f: "o", t: t, ts: Date.now(), pending: true,
      replyId: replyTo ? replyTo.id : "", q: replyTo ? { id: replyTo.id, who: replyTo.f === "o" ? "Вы" : "Гость", t: replyTo.k === "voice" ? "Голосовое сообщение" : replyTo.k === "vn" ? "Кружочек" : String(replyTo.t).slice(0, 160) } : null };
    pending.push(p); closeReply(); renderThread(); scrollEnd(true);
    deliver(p);
  }
  function deliver(p) {
    api({ action: "opPanelSend", cid: p.cid, text: p.t, replyId: p.replyId, cmid: p.id }, 25000).then(function (r) {
      // неизвестная /команда — не отправляем, показываем список команд
      if (r && r.err === "cmd") { pending = pending.filter(function (x) { return x !== p; }); renderThread(); alert(r.help || "Не знаю такую команду"); return; }
      if (!r || !r.ok) throw new Error("fail");
      pending = pending.filter(function (x) { return x !== p; });
      if (p.cid === cur && r.item && !thread.some(function (x) { return x.id === r.item.id; })) thread.push(r.item);
      renderThread();
    }).catch(function () {
      // один сбой — тихо повторяем, и только потом «Не отправлено»
      p.tries = (p.tries || 0) + 1;
      if (p.tries < 3) return setTimeout(function () { deliver(p); }, 400 * p.tries);
      p.pending = false; p.failed = true; p.tries = 0; renderThread();
    });
  }

  D.addEventListener("visibilitychange", function () {
    if (D.visibilityState !== "visible") return;
    wakeUp();
    if (cur) { var c = chatBy(cur); if (c && c.un) markRead(cur); }
  });
  setInterval(function () { renderHead(); renderList(); }, 30000);

  if (code) {
    // сразу показываем то, что было при прошлом входе, — без ожидания Google
    var cached = loadCache();
    if (cached) {
      $("login").classList.add("hidden"); $("app").classList.remove("hidden");
      chats = visibleChats(cached.chats);
      if (cached.cur && cached.thread) { threads[cached.cur] = cached.thread; }
      renderList();
    }
    $("conn").textContent = "Обновляем…";
    api({ action: "opPanel" }, 25000).then(function (r) {
      if (r && r.auth === false) { logoutLocal(); return showLogin("Вход истёк — войдите снова"); }
      start(r && r.ok ? r : null);
    }).catch(function () { start(null); });
  } else showLogin();
})();
</script>
</body>
</html>
